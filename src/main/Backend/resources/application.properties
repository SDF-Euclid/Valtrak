spring.application.name=Valtrak

# --- Database ---------------------------------------------------------------
# Default: a file-based H2 database in ./data so accounts survive restarts.
# For MySQL, start the server with SPRING_PROFILES_ACTIVE=mysql and set
# DB_URL, DB_USERNAME and DB_PASSWORD (see application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/valtrak
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Email (verification codes) ---------------------------------------------
# With no mail server configured, the server prints verification codes to its
# console instead of emailing them (development mode). To send real email, set
# these (for example as environment variables) before starting the server:
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
valtrak.mail.from=${VALTRAK_MAIL_FROM:no-reply@valtrak.local}
